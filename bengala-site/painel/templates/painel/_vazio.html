<div class="vazio">

    <path d="M169.28 60 A80 80 0 1 1 140 30.72" fill="none" style="stroke:var(--tinta)" stroke-width="11" stroke-linecap="round"/>
    <g class="agulha"><polygon points="168,100 100,86 100,114" fill="#F2B705"/><polygon points="46,100 100,86 100,114" style="fill:var(--tinta)"/></g>
    <circle cx="100" cy="100" r="5.5" style="fill:var(--pivo)"/>

  <strong>{{ titulo|default:"Nada por aqui" }}</strong>
  <span>{{ texto }}</span>

</div>
