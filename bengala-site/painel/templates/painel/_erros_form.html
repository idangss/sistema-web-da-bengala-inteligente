{% if form.errors %}
<div class="alert alert-danger" role="alert">
  <p class="fw-bold mb-1">Corrija os campos abaixo:</p>
  <ul class="mb-0">
    {% for e in form.non_field_errors %}<li>{{ e }}</li>{% endfor %}
    {% for campo in form %}{% if campo.errors %}<li><a href="#{{ campo.id_for_label }}">{{ campo.label }}</a>: {{ campo.errors|join:" " }}</li>{% endif %}{% endfor %}
  </ul>
</div>
{% endif %}
